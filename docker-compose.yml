services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agxrag-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agx
      POSTGRES_PASSWORD: agx
      POSTGRES_DB: agxrag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agx -d agxrag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
